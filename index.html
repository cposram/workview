<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠距工作日誌產生器 (國稅局防禦進階版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h1, h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .date-selectors {
            display: flex;
            gap: 10px;
        }
        .task-manager {
            background: #f1f4f8;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
        }
        .task-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .task-tag {
            background: var(--primary-color);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .task-tag span {
            cursor: pointer;
            font-weight: bold;
            color: #ff9999;
        }
        .task-tag span:hover { color: #ff4d4d; }
        .add-task-row { display: flex; gap: 10px; }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-generate {
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            background-color: #27ae60;
            margin-top: 10px;
        }
        .btn-generate:hover { background-color: #219653; }
        
        /* 報表輸出區 */
        #reportArea {
            display: none;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .report-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .edit-hint {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            border: 1px solid #ffeeba;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--primary-color);
            color: white;
        }
        tr:nth-child(even) { background-color: #fcfcfc; }
        
        /* 標籤強調顏色 */
        .loc-tag { font-weight: bold; padding: 2px 4px; border-radius: 3px; font-size: 0.9em; margin-right: 5px; }
        .loc-remote { background-color: #e8f4f8; color: #0277bd; }
        .loc-onsite { background-color: #fce4ec; color: #c2185b; }
        .loc-meeting { background-color: #f3e5f5; color: #7b1fa2; }
        .highlight-output { color: #d35400; font-size: 0.9em; margin-left: 5px; }

        .editable-cell[contenteditable="true"] {
            transition: all 0.2s;
        }
        .editable-cell[contenteditable="true"]:hover {
            background-color: #ffffcc;
            outline: 2px dashed #f39c12;
            cursor: text;
        }
        .editable-cell[contenteditable="true"]:focus {
            background-color: #fff;
            outline: 2px solid #3498db;
        }

        .btn-delete-row {
            background-color: #e74c3c;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-delete-row:hover { background-color: #c0392b; }
        .btn-copy { background-color: #f39c12; margin-top: 20px; }
        .btn-copy:hover { background-color: #d68910; }

        @media print {
            body { background: white; padding: 0; }
            .container, .btn-copy, .btn-email, .no-print, .edit-hint { display: none !important; }
            #reportArea { display: block; box-shadow: none; padding: 0; }
            .editable-cell[contenteditable="true"] { outline: none !important; background-color: transparent !important; }
            /* 列印時強制顯示顏色標籤 */
            .loc-remote { border: 1px solid #0277bd; }
            .loc-onsite { border: 1px solid #c2185b; }
            .loc-meeting { border: 1px solid #7b1fa2; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 遠距工作日誌產生器 (防查核進階版)</h1>
    
    <div class="grid-2">
        <div class="form-group">
            <label for="companyName">🏢 工作單位名稱</label>
            <input type="text" id="companyName" placeholder="例如：某某科技有限公司" value="某某科技有限公司">
        </div>
        <div class="form-group">
            <label for="employeeName">👤 受僱者名稱</label>
            <input type="text" id="employeeName" placeholder="例如：王小明">
        </div>
        <div class="form-group">
            <label for="apiToken">🔒 寄件通關密碼</label>
            <input type="password" id="apiToken" placeholder="輸入通關密碼 (例如: 0924)">
        </div>
        <div class="form-group">
            <label>📅 請選擇產出年份與月份</label>
            <div class="date-selectors">
                <select id="workYear"></select>
                <select id="workMonth">
                    <option value="01">1月</option><option value="02">2月</option>
                    <option value="03">3月</option><option value="04">4月</option>
                    <option value="05">5月</option><option value="06">6月</option>
                    <option value="07">7月</option><option value="08">8月</option>
                    <option value="09">9月</option><option value="10">10月</option>
                    <option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
        </div>
    </div>

    <div class="task-manager">
        <label>🛠️ 核心工作項目設定 (產出時將自動展開為「具體勞務行為」以備查核)</label>
        <div class="task-list" id="taskList"></div>
        <div class="add-task-row">
            <input type="text" id="newTaskInput" placeholder="輸入新的工作項目 (例如: 競品分析)...">
            <button type="button" onclick="addTask()">新增項目</button>
        </div>
    </div>

    <button class="btn-generate" onclick="generateReport()">🚀 一鍵生成高可信度工作日誌</button>
</div>

<div id="reportArea">
    <div class="report-header">
        <h2 id="reportTitle">工作日誌月報表</h2>
        <p><strong>工作單位：</strong> <span id="outCompany"></span> &nbsp;&nbsp;|&nbsp;&nbsp; <strong>受僱者：</strong> <span id="outEmployee"></span></p>
        <p><strong>申報區間：</strong> <span id="outPeriod"></span> &nbsp;&nbsp;|&nbsp;&nbsp; <strong>表定工時：</strong> 週一至週五 08:00~17:00</p>
    </div>

    <div class="edit-hint">💡 提示：本報表已自動混入【遠距/現場】標籤與具體勞務產出。點擊文字可手動微調，遇假日請按右側刪除。</div>

    <table id="logTable">
        <thead>
            <tr>
                <th width="10%">日期</th>
                <th width="8%">星期</th>
                <th width="18%">時間紀錄</th>
                <th>具體工作內容摘要與產出</th>
                <th width="8%" class="no-print">操作</th>
            </tr>
        </thead>
        <tbody id="reportTableBody">
            <!-- 報表內容 -->
        </tbody>
    </table>
    
    <button class="btn-copy" onclick="window.print()">🖨️ 列印 / 存成 PDF 備查</button>
    <button class="btn-email" id="btnSendEmail" onclick="sendEmail()" style="background-color: #e74c3c; margin-left: 10px; margin-top: 20px;">✉️ 寄送給老闆</button>
</div>

<script>
    // 預設核心工作項目
    let tasks = ["教具製作", "網路輿情蒐集", "公關事件處理", "帳務分析", "老闆交辦事項"];

    // 建立深度任務動詞庫 (製造真實勞務感，應付查核用)
    const taskDictionary = {
        "教具製作": [
            "撰寫教案初稿結構", "設計與排版互動式教學簡報", "蒐集課程所需之多媒體影音素材", 
            "剪輯線上教學影片(含上字幕)", "校對教材錯字與更新內容排版", "製作學員課後測驗卷與解答", 
            "線上測試電子教具操作流暢度", "整理實體教具數位化歸檔清單"
        ],
        "網路輿情蒐集": [
            "監測社群(FB/IG)討論熱度並截圖紀錄", "彙整本週競品行銷活動分析", "追蹤PTT/Dcard相關關鍵字並建檔", 
            "分析客訴留言並初步擬定回應草稿", "產出單日網路輿情觀測速報", "更新KOL與網紅合作名單資料庫"
        ],
        "公關事件處理": [
            "草擬對外公關新聞稿/聲明稿", "更新媒體公關與記者聯絡人清單", "協助回覆客戶與合作單位之反映信件", 
            "蒐集同業公關危機處理案例作為內部參考", "與外部行銷團隊進行線上進度對焦", "追蹤公關發稿後續曝光效益與流量"
        ],
        "帳務分析": [
            "核對當月零用金與雲端發票明細", "整理廠商請款單據並數位建檔", "製作下階段行銷專案預算初稿", 
            "分析上季專案成本與投資報酬率效益", "彙總各部門差旅與雜項費用報表", "登錄電子收據並與財務系統核對"
        ],
        "老闆交辦事項": [
            "整理內部跨部門線上會議紀錄", "協尋特定供應商報價與聯絡資訊", "更新與維護內部專案進度追蹤表(Excel)", 
            "協助安排下週高階主管會議議程", "處理急件文件排版、轉檔與發送", "盤點文具與線上軟體訂閱授權期限"
        ]
    };

    // 若使用者新增不在字典內的任務，則套用這些萬用商務動詞
    const genericActions = [
        "蒐集與盤點 [TASK] 相關前置資料", "進行 [TASK] 初步規劃與草稿撰寫", 
        "執行 [TASK] 作業並產出階段性進度", "與團隊線上討論 [TASK] 後續優化方向", 
        "彙整 [TASK] 相關數據並製作報表", "覆核 [TASK] 最終產出品質與準備歸檔"
    ];

    // 辦公型態機率池 (約 70%遠距, 15%現場, 15%線上會議)
    const locationPool = [
        { label: "【遠距辦公】", css: "loc-remote" }, { label: "【遠距辦公】", css: "loc-remote" },
        { label: "【遠距辦公】", css: "loc-remote" }, { label: "【遠距辦公】", css: "loc-remote" },
        { label: "【遠距辦公】", css: "loc-remote" }, { label: "【現場支援】", css: "loc-onsite" },
        { label: "【線上會議】", css: "loc-meeting" }
    ];

    // 產出量化後綴詞 (增加勞務真實感)
    const outputSuffixes = ["(完成進度約 80%)", "(產出1份檔案)", "(已彙整建檔)", "(產出初稿待審)", "(提供相關報表)", "(會議記錄已發出)"];

    window.onload = () => {
        const yearSelect = document.getElementById('workYear');
        for(let y = 2023; y <= 2035; y++) {
            let option = document.createElement('option');
            option.value = y;
            option.text = y + '年';
            yearSelect.appendChild(option);
        }
        const today = new Date();
        yearSelect.value = today.getFullYear();
        document.getElementById('workMonth').value = String(today.getMonth() + 1).padStart(2, '0');
        renderTasks();
    };

    function renderTasks() {
        const taskListDiv = document.getElementById('taskList');
        taskListDiv.innerHTML = '';
        tasks.forEach((task, index) => {
            const tag = document.createElement('div');
            tag.className = 'task-tag';
            tag.innerHTML = `${task} <span onclick="removeTask(${index})" title="刪除">✖</span>`;
            taskListDiv.appendChild(tag);
        });
    }

    function addTask() {
        const input = document.getElementById('newTaskInput');
        const val = input.value.trim();
        if (val && !tasks.includes(val)) {
            tasks.push(val);
            input.value = '';
            renderTasks();
        }
    }

    function removeTask(index) {
        tasks.splice(index, 1);
        renderTasks();
    }

    // 取得具體的行為描述
    function getSpecificAction(taskName) {
        let actionList = taskDictionary[taskName];
        if (!actionList) {
            // 套用萬用詞
            let generic = genericActions[Math.floor(Math.random() * genericActions.length)];
            return generic.replace("[TASK]", taskName);
        }
        return actionList[Math.floor(Math.random() * actionList.length)];
    }

    // 隨機取得辦公地點
    function getRandomLocation() {
        return locationPool[Math.floor(Math.random() * locationPool.length)];
    }

    // 隨機取得產出後綴 (約30%機率出現)
    function getRandomSuffix() {
        if (Math.random() < 0.3) {
            return ` <span class="highlight-output">${outputSuffixes[Math.floor(Math.random() * outputSuffixes.length)]}</span>`;
        }
        return "";
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function generateReport() {
        const company = document.getElementById('companyName').value || '未填寫單位';
        const employee = document.getElementById('employeeName').value || '未填寫姓名';
        const year = document.getElementById('workYear').value;
        const month = document.getElementById('workMonth').value;

        if (tasks.length === 0) {
            alert("請至少保留一個工作項目！");
            return;
        }
        
        document.getElementById('reportTitle').innerText = `${year}年${month}月 工作日誌`;
        document.getElementById('outCompany').innerText = company;
        document.getElementById('outEmployee').innerText = employee;
        document.getElementById('outPeriod').innerText = `${year}年${month}月01日 至 該月底`;

        const tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = ''; 

        const daysInMonth = new Date(year, month, 0).getDate();
        const weekDayNames = ["日", "一", "二", "三", "四", "五", "六"];

        for (let day = 1; day <= daysInMonth; day++) {
            let currentDate = new Date(year, month - 1, day);
            let dayOfWeek = currentDate.getDay();

            // 週一到週五
            if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                let shuffledTasks = shuffleArray(tasks);
                
                // 決定上下午各負責什麼主軸
                let amBaseTask = shuffledTasks[0];
                let pmBaseTask = shuffledTasks.length > 1 ? shuffledTasks[1] : shuffledTasks[0];
                let otherTask = shuffledTasks.length > 2 ? shuffledTasks[2] : null;

                // 產生具體行為句子
                let amAction1 = getSpecificAction(amBaseTask);
                let amAction2 = otherTask && Math.random() > 0.5 ? getSpecificAction(otherTask) : "";
                
                let pmAction1 = getSpecificAction(pmBaseTask);
                let pmAction2 = Math.random() > 0.6 ? getSpecificAction(amBaseTask) : ""; // 下午可能繼續早上的事

                let locAm = getRandomLocation();
                let locPm = getRandomLocation();
                
                // 為了邏輯合理，如果早上現場，下午有40%機率也是現場
                if (locAm.label === "【現場支援】" && Math.random() > 0.6) locPm = locAm;

                let amHtml = `<span class="loc-tag ${locAm.css}">${locAm.label}</span> ${amAction1}${getRandomSuffix()}`;
                if(amAction2) amHtml += `<br><span class="loc-tag ${locAm.css}">${locAm.label}</span> ${amAction2}${getRandomSuffix()}`;
                
                let pmHtml = `<span class="loc-tag ${locPm.css}">${locPm.label}</span> ${pmAction1}${getRandomSuffix()}`;
                if(pmAction2 && pmAction1 !== pmAction2) pmHtml += `<br><span class="loc-tag ${locPm.css}">${locPm.label}</span> ${pmAction2}`;

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${month}/${String(day).padStart(2, '0')}</td>
                    <td style="text-align: center;">週${weekDayNames[dayOfWeek]}</td>
                    <td contenteditable="true" class="editable-cell" style="font-family: monospace; font-size: 0.95em;">
                        08:00~12:00 (4h)<br>
                        <span style="color:#aaa; font-size:12px;">12:00~13:00 休息</span><br>
                        13:00~17:00 (4h)
                    </td>
                    <td contenteditable="true" class="editable-cell" style="line-height: 1.8;">
                        <strong>[上午]</strong><br>${amHtml}<br>
                        <strong>[下午]</strong><br>${pmHtml}
                    </td>
                    <td class="no-print" style="text-align: center;">
                        <button class="btn-delete-row" onclick="this.closest('tr').remove()" title="若是國定假日/請假請點此刪除">🗑️刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        document.getElementById('reportArea').style.display = 'block';
        document.getElementById('reportArea').scrollIntoView({ behavior: 'smooth' });
    }
    
    // ======= 寄信功能保留原始邏輯，但增加防止跑版設定 =======
    async function sendEmail() {
        const company = document.getElementById('companyName').value || '未填寫單位';
        const employee = document.getElementById('employeeName').value || '未填寫姓名';
        const year = document.getElementById('workYear').value;
        const month = document.getElementById('workMonth').value;
        const token = document.getElementById('apiToken').value;

        if (!token) {
            alert("請輸入寄件通關密碼！");
            return;
        }

        const btn = document.getElementById('btnSendEmail');
        btn.disabled = true;
        btn.innerText = '寄送中...';

        const subject = `【工作日誌】${year}年${month}月 - ${employee} (${company})`;

        const tableClone = document.getElementById('logTable').cloneNode(true);
        const noPrintEls = tableClone.querySelectorAll('.no-print');
        noPrintEls.forEach(el => el.remove());
        const editableEls = tableClone.querySelectorAll('[contenteditable]');
        editableEls.forEach(el => el.removeAttribute('contenteditable'));

        const tableHtml = tableClone.outerHTML;
        const htmlBody = `
            <div style="font-family: Arial, sans-serif; color: #333; line-height: 1.6; width: 100%; max-width: 800px;">
                <h2 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px;">${year}年${month}月 工作日誌</h2>
                <p><strong>工作單位：</strong> ${company}</p>
                <p><strong>受僱者：</strong> ${employee}</p>
                <p><strong>表定工時：</strong> 週一至週五 08:00~17:00</p>
                <br>
                ${tableHtml}
            </div>
        `;

        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyxs5f_0HxroSOmDw9gToUNBt2MKk1wm0uEsvi1DcRCSonuf07UnwLjb7ZxUUmgB_Ti/exec';

        try {
            const response = await fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ token: token, subject: subject, htmlBody: htmlBody })
            });

            const result = await response.json();
            if (result.status === "success") {
                alert('✅ 已經成功透過您的 Gmail 寄送給老闆！');
            } else {
                alert('❌ 寄件失敗：' + result.message);
            }
        } catch (error) {
            alert('❌ 發生錯誤，信件可能已經送出或遇到網路問題。請至您的 Gmail 備份夾確認。');
            console.error(error);
        } finally {
            btn.disabled = false;
            btn.innerText = '✉️ 寄送給老闆';
        }
    }
</script>

</body>
</html>
